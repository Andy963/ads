name: pre-release

on:
  push:
    branches:
      - dev
    tags:
      - "v0.0.*"
      - "v*-pre*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify dev toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          npx --no tsx --version
          npx --no vitest --version

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run web tests
        run: npm run test:web

      - name: Install browser engines
        run: npx --no playwright install --with-deps webkit chromium

      - name: Run chat browser regressions
        run: npm run test:chat-browser

      - name: Resolve pre-release version and tag
        id: vars
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          # Formal releases are 2 digits (e.g. v0.4, v0.3).
          # Pre-releases / patch versions are 3 digits (e.g. v0.4.1, v0.3.9) or contain pre-release suffix.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Formal 2-digit release $TAG detected. Skipping pre-release workflow."
            IS_PRERELEASE="false"
          else
            IS_PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Package dist
        if: steps.vars.outputs.is_prerelease == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          tar -czf "ads-${TAG}.tgz" dist package.json package-lock.json README.md LICENSE .env.example .env.advanced.example

      - name: Create GitHub pre-release
        if: steps.vars.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: "ADS ${{ steps.vars.outputs.tag }} (Pre-release)"
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            ads-${{ steps.vars.outputs.tag }}.tgz
