name: pre-release

on:
  push:
    branches:
      - dev
    tags:
      - "v0.0.*"
      - "v*-pre*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Verify dev toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          rustc --version
          cargo --version
          npm --prefix client exec --no -- vitest --version

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Lint Rust server
        working-directory: rust-server
        run: cargo clippy --workspace --all-targets

      - name: Test Rust server
        working-directory: rust-server
        run: cargo test --workspace -- --test-threads=2

      - name: Build Rust release binaries
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        working-directory: rust-server
        run: cargo build --release -p ads-server -p ads-telegram

      - name: Resolve pre-release version and tag
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        id: vars
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./client/package.json').version")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          # Formal releases are 2 digits (e.g. v0.4, v0.3).
          # Pre-releases / patch versions are 3 digits (e.g. v0.4.1, v0.3.9) or contain pre-release suffix.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Formal 2-digit release $TAG detected. Skipping pre-release workflow."
            IS_PRERELEASE="false"
          else
            IS_PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Package dist
        if: steps.vars.outputs.is_prerelease == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          STAGE_DIR="$RUNNER_TEMP/ads-release-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/bin" "$STAGE_DIR/dist"
          cp -p rust-server/target/release/ads-server "$STAGE_DIR/bin/ads-server"
          cp -p rust-server/target/release/ads-telegram "$STAGE_DIR/bin/ads-telegram"
          cp -a client/dist "$STAGE_DIR/dist/client"
          cp -p README.md LICENSE .env.example .env.advanced.example "$STAGE_DIR/"
          tar -czf "ads-${TAG}.tgz" -C "$STAGE_DIR" bin dist README.md LICENSE .env.example .env.advanced.example
          test -x "$STAGE_DIR/bin/ads-server"
          test -x "$STAGE_DIR/bin/ads-telegram"
          test -f "$STAGE_DIR/dist/client/index.html"

      - name: Create GitHub pre-release
        if: steps.vars.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: "ADS ${{ steps.vars.outputs.tag }} (Pre-release)"
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            ads-${{ steps.vars.outputs.tag }}.tgz
