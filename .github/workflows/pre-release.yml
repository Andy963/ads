name: pre-release

on:
  push:
    branches:
      - dev
    tags:
      - "v0.0.*"
      - "v*-pre*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify dev toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          npx --no tsx --version
          npx --no vitest --version

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run web tests
        run: npm run test:web

      - name: Resolve pre-release version and tag
        id: vars
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package dist
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          tar -czf "ads-${TAG}.tgz" dist package.json package-lock.json README.md LICENSE .env.example .env.advanced.example

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: "ADS ${{ steps.vars.outputs.tag }} (Pre-release)"
          tag_name: ${{ steps.vars.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            ads-${{ steps.vars.outputs.tag }}.tgz
