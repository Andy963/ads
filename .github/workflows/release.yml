name: release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            ts-server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: ts-server
        run: npm ci

      - name: Verify dev toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          npx --no tsx --version
          npx --no vitest --version

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Build server
        working-directory: ts-server
        run: npm run build

      - name: Verify release layout
        working-directory: ts-server
        run: npm run verify:release

      - name: Run unit tests
        working-directory: ts-server
        run: npm test

      - name: Run web tests
        working-directory: client
        run: npm test

      - name: Install browser engines
        working-directory: client
        run: npx --no playwright install --with-deps webkit chromium

      - name: Run chat browser regressions
        working-directory: client
        run: npm run test:chat-browser

      - name: Run model and retry browser regressions
        env:
          TMPDIR: ${{ runner.temp }}
        working-directory: client
        run: |
          npm run test:model-settings-browser
          npm run test:model-selection-browser
          npm run test:message-retry-browser

      - name: Upload retry browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: message-retry-browser-failure
          path: ${{ runner.temp }}/ads-message-retry-*/
          if-no-files-found: ignore
          retention-days: 7

      - name: Resolve release version and tag
        id: vars
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./ts-server/package.json').version")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            RELEASE="true"
          else
            RELEASE="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Package dist
        if: steps.vars.outputs.release == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          tar -czf "ads-${TAG}.tgz" client/dist ts-server/dist ts-server/package.json ts-server/package-lock.json README.md LICENSE .env.example .env.advanced.example
          SMOKE_DIR="$RUNNER_TEMP/ads-release-smoke"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          tar -xzf "ads-${TAG}.tgz" -C "$SMOKE_DIR"
          node ts-server/scripts/verify-release-layout.js "$SMOKE_DIR"
          cd "$SMOKE_DIR/ts-server"
          npm ci --omit=dev --no-audit --no-fund
          node dist/server/cli.js version

      - name: Create GitHub Release
        if: steps.vars.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: "ADS ${{ steps.vars.outputs.tag }}"
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: |
            ads-${{ steps.vars.outputs.tag }}.tgz
