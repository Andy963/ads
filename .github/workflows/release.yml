name: release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify dev toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          npx --no tsx --version
          npx --no vitest --version

      - name: Run unit tests
        run: npm test

      - name: Run web tests
        run: npm run test:web

      - name: Build
        run: npm run build

      - name: Resolve release version and tag
        id: vars
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            RELEASE="true"
          else
            RELEASE="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Package dist
        if: steps.vars.outputs.release == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          tar -czf "ads-${TAG}.tgz" dist package.json package-lock.json README.md LICENSE .env.example .env.advanced.example

      - name: Create GitHub Release
        if: steps.vars.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "ADS ${{ steps.vars.outputs.tag }}"
          tag_name: ${{ steps.vars.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            ads-${{ steps.vars.outputs.tag }}.tgz
