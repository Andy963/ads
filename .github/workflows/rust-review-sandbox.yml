name: rust-review-sandbox

on:
  pull_request:
    paths:
      - ".github/workflows/rust-review-sandbox.yml"
      - "docs/adr/0060-reviewer-owned-verification-selection.md"
      - "rust-server/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reviewer-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bubblewrap and resource-limit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Require a real isolated verification run
        env:
          ADS_REQUIRE_REVIEW_SANDBOX: "1"
          CARGO_BUILD_JOBS: "2"
        run: >-
          cargo test
          --manifest-path rust-server/Cargo.toml
          -p ads-native
          --test reviewer_inspection
          actual_bubblewrap_runs_verification_in_isolated_namespaces_when_required
          -- --exact
