[workspace]
members = [
  "crates/ads-acp",
  "crates/ads-actions",
  "crates/ads-contract",
  "crates/ads-native",
  "crates/ads-reviewer",
  "crates/ads-state",
  "crates/ads-runtime",
  "crates/ads-telegram",
  "crates/ads-auth",
  "crates/ads-http",
  "crates/ads-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
ads-acp = { path = "crates/ads-acp" }
ads-actions = { path = "crates/ads-actions" }
ads-auth = { path = "crates/ads-auth" }
ads-contract = { path = "crates/ads-contract" }
ads-http = { path = "crates/ads-http" }
ads-native = { path = "crates/ads-native" }
ads-reviewer = { path = "crates/ads-reviewer" }
ads-state = { path = "crates/ads-state" }
ads-runtime = { path = "crates/ads-runtime" }
ads-telegram = { path = "crates/ads-telegram" }
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
flate2 = "1"
futures-util = "0.3"
globset = "0.4"
base64 = "0.22"
bytes = "1"
hex = "0.4"
hkdf = "0.12"
http-body-util = "0.1"
libc = "0.2"
oxc_allocator = "0.75"
oxc_ast = "0.75"
oxc_ast_visit = "0.75"
oxc_parser = "0.75"
oxc_span = "0.75"
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.41.1", features = ["bundled"] }
scrypt = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
